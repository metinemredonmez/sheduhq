name: CI

on:
  push:
    branches: [main]
  pull_request:

# En az yetki: CI yalnızca kodu okur (OPS-04).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        # Tam sürüm etiketi + çok mimarili manifest özeti (OPS-04); özet elle güncellenir.
        image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          # Yalnızca CI'daki geçici veritabanı; gerçek bir sır değildir.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Araç zinciri
        env:
          # Kesin kararlı sürüm; "stable" kanalı zamanla değişir (OPS-04).
          RUST_TOOLCHAIN: "1.100.0"
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
      - name: Biçim
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all
      - name: Entegrasyon testleri (giriş, oturum, panel, komut, WebSocket; PostgreSQL 19)
        run: cargo test --locked -p shedu-api --features db-tests

  ai:
    name: AI servisi (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: uv
        env:
          UV_VERSION: "0.13.10"
          # PyPI'deki manylinux x86_64 tekerleğinin SHA-256 özeti (ubuntu-latest).
          UV_SHA256: 7cc9c41b43d583e34c781fd3446405b06e9c5fa2db468ce2a534d353db6429e5
        run: |
          echo "uv==${UV_VERSION} --hash=sha256:${UV_SHA256}" > "${RUNNER_TEMP}/uv-requirements.txt"
          python -m pip install --require-hashes --only-binary :all: --no-deps -r "${RUNNER_TEMP}/uv-requirements.txt"
      - name: Bağımlılıklar
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Test
        run: uv run pytest -q

  database:
    name: Veritabanı şeması (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 19: en son sürüm (hedef). 18: bulut sağlayıcılarının yeni sürümü sunması gecikirse
        # kullanılacak bir önceki sürüm. İmajlar tam sürüm etiketi + çok mimarili manifest
        # özetiyle sabitlenir (OPS-04); özetler elle güncellenir.
        include:
          - postgres: "19"
            image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
          - postgres: "18"
            image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          # Yalnızca CI'daki geçici veritabanı; gerçek bir sır değildir.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shedu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: shedu_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Migration ve SQL testleri
        run: services/backend/scripts/test-db.sh

  secrets:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (sürüm ve özet sabitlenmiş)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
