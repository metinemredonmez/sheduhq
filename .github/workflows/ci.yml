name: CI

on:
  push:
    branches: [main]
  pull_request:

# En az yetki: CI yalnızca kodu okur (OPS-04).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: postgres:19-alpine
        env:
          # Yalnızca CI'daki geçici veritabanı; gerçek bir sır değildir.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Araç zinciri
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Biçim
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all
      - name: Entegrasyon testleri (giriş ve oturum, PostgreSQL 19)
        run: cargo test --locked -p shedu-api --features db-tests --test auth

  ai:
    name: AI servisi (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: uv
        run: python -m pip install --upgrade "uv>=0.9,<1"
      - name: Bağımlılıklar
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Test
        run: uv run pytest -q

  database:
    name: Veritabanı şeması (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 19: en son sürüm (hedef). 18: bulut sağlayıcılarının yeni sürümü sunması gecikirse
        # kullanılacak bir önceki sürüm.
        postgres: ["19", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          # Yalnızca CI'daki geçici veritabanı; gerçek bir sır değildir.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shedu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: shedu_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Migration ve SQL testleri
        run: services/backend/scripts/test-db.sh

  secrets:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (sürüm ve özet sabitlenmiş)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
