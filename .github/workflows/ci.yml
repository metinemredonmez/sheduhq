name: CI

on:
  push:
    branches: [main]
  pull_request:

# En az yetki: CI yalnızca kodu okur (OPS-04).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Araç zinciri
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Biçim
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all

  ai:
    name: AI servisi (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: uv
        run: python -m pip install --upgrade "uv>=0.9,<1"
      - name: Bağımlılıklar
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Test
        run: uv run pytest -q
