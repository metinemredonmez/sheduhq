version: 2
updates:
  - package-ecosystem: cargo
    directory: /services/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /services/ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # SHA'ya sabitli aksiyonları ve satır sonundaki "# vX.Y.Z" yorumunu birlikte günceller.
  # Dependabot iş akışındaki services.image, Rust ve uv sabitlerini taramaz; ci.yml'de elle
  # güncellenir (OPS-04).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
