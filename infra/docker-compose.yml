# Yalnızca yerel geliştirme içindir; üretimde kullanılmaz.
# Bütün portlar yalnızca 127.0.0.1'e bağlanır (OPS-01). Parolalar .env dosyasından gelir.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shedu
      POSTGRES_USER: shedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shedu -d shedu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD .env dosyasında tanımlanmalı}"]
    ports:
      - "127.0.0.1:6379:6379"

  mqtt:
    # Panel protokolü netleşene kadar gateway geliştirmesi için yer tutucu broker.
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config

volumes:
  postgres-data:
