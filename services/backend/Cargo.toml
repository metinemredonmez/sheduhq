[workspace]
resolver = "3"
members = ["crates/domain", "crates/api", "crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
shedu-domain = { path = "crates/domain" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
# Güvenli olmayan Rust kodu yasak; gerekirse gerekçesiyle tek tek açılır.
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
