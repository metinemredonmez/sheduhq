[workspace]
resolver = "3"
members = ["crates/domain", "crates/api", "crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# sqlx 0.9 en az 1.94 ister; geliştirme ve CI en son kararlı sürümle yapılır.
rust-version = "1.94"
publish = false

[workspace.dependencies]
shedu-domain = { path = "crates/domain" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros"] }
# Yalnızca HS256 kullanılır; PEM ve diğer algoritmalar bilerek kapalı (TOK-01).
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6"
hmac = "0.13"
sha2 = "0.11"
# TOTP (RFC 6238) HMAC-SHA1 kullanır; başka hiçbir yerde SHA-1 kullanılmaz.
sha1 = "0.11"
# TOTP sırlarının veritabanında şifrelenmesi (KEY-04).
chacha20poly1305 = "0.11"
base64 = "0.23"
subtle = "2.6"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
# Yönetici komut satırı aracı (shedu-admin).
clap = { version = "4.6", features = ["derive", "env"] }
# İç AI servisine ve bildirim sağlayıcılarına (APNs, FCM, İleti Merkezi) HTTP istemcisi. TLS
# rustls + ring (sqlx ile aynı kripto sağlayıcısı); vekil sunucu ve sistem vekil ayarı kapalı.
# APNs yalnızca HTTP/2 kabul eder.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
# Sağlayıcılara giden kimlik doğrulama imzaları: APNs ES256, Google hizmet hesabı RS256. Gelen
# token'ların doğrulanmasında kullanılmaz (orada yalnızca HS256, TOK-01).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.rust]
# Güvenli olmayan Rust kodu yasak; gerekirse gerekçesiyle tek tek açılır.
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
