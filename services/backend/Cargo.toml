[workspace]
resolver = "3"
members = ["crates/domain", "crates/api", "crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# sqlx 0.9 en az 1.94 ister; geliştirme ve CI en son kararlı sürümle yapılır.
rust-version = "1.94"
publish = false

[workspace.dependencies]
shedu-domain = { path = "crates/domain" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros"] }
# Yalnızca HS256 kullanılır; PEM ve diğer algoritmalar bilerek kapalı (TOK-01).
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
subtle = "2.6"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[workspace.lints.rust]
# Güvenli olmayan Rust kodu yasak; gerekirse gerekçesiyle tek tek açılır.
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
